name: ci

# The quality gate for every channel.
#
#   feature/* → dev → stg → main
#
# Gates run on PRs into `dev`, `stg` and `main`, and again on the push that lands them. A
# stg → main PR therefore gets the full suite before anyone merges it, and `release.yml` only
# ever fires on the back of a green run here — no version is cut from a red commit.
#
# The whole matrix runs on every channel. Kwami is a published library: there is no "cheap"
# environment where a broken build is survivable, because the artifact is the product.
on:
  pull_request:
    branches: [dev, stg, main]
  push:
    branches: [dev, stg, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A superseded PR run is wasted work; a push may be feeding a release, so let it finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace

      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # First-parent only. A promote PR that absorbs history from another channel would
          # otherwise fail on subjects that already shipped; this still lints every commit
          # that landed on this branch's own line, merge commits included.
          while IFS= read -r sha; do
            git log -1 --pretty=%B "$sha" | pnpm exec commitlint --verbose
          done < <(git rev-list --first-parent "${BASE_SHA}..${HEAD_SHA}")

  verify:
    name: lint · format · typecheck · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # Covers tests/ and the config files too, not just src/ — see tsconfig.test.json.
      - name: Typecheck
        run: pnpm typecheck

      # A hard gate ratcheted against scripts/ci/audit-baseline.json: any critical/high
      # advisory that is not already listed fails the build. `continue-on-error: true` on an
      # audit step is not a gate, it is a log line.
      - name: Dependency audit
        run: pnpm audit:ci

  unit:
    name: unit (vitest)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace

      # Coverage runs the same tests as `pnpm test:unit` plus the ratchet in vitest.config.ts
      # — run this one, not both.
      - name: Unit tests with the coverage floor
        run: pnpm test:coverage

      - name: CI scripts (node:test)
        run: pnpm test:ci-scripts

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: integration (vitest)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace

      # Boots a real node:http server and drives the api-client over a real socket.
      - name: Integration tests
        run: pnpm test:integration

  build:
    name: build (dist)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace

      - name: Build the library
        run: pnpm build

      # A build that emits no entry point or no types is a broken publish, and neither the
      # bundler nor tsc necessarily fails loudly about it.
      - name: Assert the package entry points exist
        run: |
          set -euo pipefail
          for file in dist/index.js dist/index.d.ts; do
            test -s "$file" || { echo "::error::missing or empty $file"; exit 1; }
          done
          echo "### Build" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "\`dist\` is $(du -sh dist | cut -f1) across $(find dist -type f | wc -l) files." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: e2e (playwright)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace

      # Reuse the artifact the build job produced: the e2e layer's whole point is to test the
      # bundle that would actually be published, not a second build of it.
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The runner has no GPU; playwright.config.ts starts Chromium on SwiftShader so the
      # renderers get a real WebGL2 context in software.
      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  gate:
    name: ci gate
    needs: [commits, verify, unit, integration, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # One required status check to protect the branches with, instead of six that each have
      # to be added by name and re-added whenever a job is renamed. `commits` is skipped on
      # push, so `skipped` has to count as passing — but `failure` and `cancelled` never do.
      - name: Require no failures
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::ci failed (${RESULTS})"; exit 1 ;;
            esac
          done
          echo "All gates green."
