version: 2

updates:
  # Deploy, release and promotion logic all live in pinned actions — a stale one is a
  # supply-chain risk, not a convenience.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 5
    # `ci:` releases nothing — a workflow bump should not cut a version.
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    # Dependabot opens against the default branch; `dev` is where the promote path starts.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    # `build(deps)` cuts a patch release (see .releaserc.cjs) because a shipped dependency
    # bump reaches consumers; `chore(deps-dev)` does not, because a devDependency does not.
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    labels:
      - dependencies
    groups:
      # A three.js major is a breaking change for consumers — it must get its own PR and a
      # human. Everything else can travel together.
      three-ecosystem:
        patterns:
          - three
          - '@types/three'
        update-types:
          - minor
          - patch
      typescript-ecosystem:
        patterns:
          - typescript
          - typescript-eslint
          - '@typescript-eslint/*'
          - '@types/*'
        exclude-patterns:
          - '@types/three'
      testing:
        patterns:
          - vitest
          - '@vitest/*'
          - '@playwright/test'
          - happy-dom
      release-tooling:
        patterns:
          - semantic-release
          - '@semantic-release/*'
          - '@commitlint/*'
          - husky
          - lint-staged
      minor-and-patch:
        patterns: ['*']
        update-types:
          - minor
          - patch
    ignore:
      # `three` is a peerDependency with a deliberately wide range; bumping the devDependency
      # major without revisiting that range would misrepresent what the library supports.
      - dependency-name: three
        update-types: [version-update:semver-major]
